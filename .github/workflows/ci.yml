name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace --locked
      - name: Collecteur Windows (vérification de compilation)
        run: cargo check -p pulse-collector --target x86_64-pc-windows-msvc --locked

  windows:
    name: Installeurs Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests sous Windows
        run: cargo test --workspace --locked
      # Installeurs d'essai, sans les fichiers de mise à jour (la clé de
      # signature ne sert qu'à la publication, voir publication.yml).
      - name: Compilation des installeurs
        run: npm run tauri build -- --no-sign --config src-tauri/tauri.essai.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: skelvia-pulse-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
