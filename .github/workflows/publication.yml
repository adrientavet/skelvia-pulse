# Publication d'une version : à chaque envoi sur main, si la version de
# src-tauri/tauri.conf.json n'est pas encore publiée. Compile les installeurs
# sous Windows, les signe avec la clé des mises à jour, et crée la page de
# téléchargement GitHub (avec l'étiquette v<version>) et latest.json, le
# fichier que SKELVIA Pulse lit pour proposer la mise à jour.
#
# Réglages du dépôt nécessaires (voir docs/publier-une-version.md) :
# - secret TAURI_SIGNING_PRIVATE_KEY : la clé privée des mises à jour ;
# - si les installeurs sont publiés dans un autre dépôt : variable
#   RELEASES_REPO (propriétaire/dépôt) et secret RELEASES_TOKEN.
name: Publication

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  version:
    name: Version déjà publiée ?
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            echo "La version $tag est déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $tag : publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Publier la version
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clé de signature présente
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque (voir docs/publier-une-version.md)."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Tests sous Windows
        run: cargo test --workspace --locked
      - name: Compilation et signature des installeurs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Préparation des fichiers
        shell: bash
        run: node scripts/preparer-publication.mjs "$TAG" "$RELEASES_REPO"
      - name: Page de téléchargement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          gh release create "$TAG" publication/* \
            --repo "$RELEASES_REPO" \
            --target "$GITHUB_SHA" \
            --title "SKELVIA Pulse ${TAG#v}" \
            --notes-file notes-de-version.md
