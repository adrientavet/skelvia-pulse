[workspace]
members = ["src-tauri", "crates/pulse-core", "crates/pulse-collector"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Adrien Tavet (SKELVIA)"]
repository = "https://github.com/adrientavet/skelvia-pulse"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
